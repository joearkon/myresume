      /* === 打印样式优化 (Print / PDF Export) === */
      @media print {
        /* 1. 核心设置：保留网页色彩与背景 */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* 2. 隐藏非核心 UI 元素 */
        nav, 
        .fixed,   
        button,   
        [aria-label="Toggle Theme"],
        [title="Switch to English"],
        form,
        .animate-float,
        .animate-pulse-glow,
        .absolute.inset-0, 
        svg.absolute,
        iframe,
        .print\:hidden,
        #chat-widget,
        #scroll-to-top
        {
          display: none !important;
        }

        /* 3. 页面边距与尺寸 */
        @page {
          margin: 0.8cm 1.2cm; 
          size: A4;
        }

        body {
          background: white !important;
          color: #1e293b !important; /* slate-800 */
          font-size: 10.5pt; 
          line-height: 1.4;
          letter-spacing: -0.01em;
          overflow: visible !important;
        }

        /* 4. 空间优化：紧凑布局 */
        section {
          padding: 16px 0 !important;
          margin: 0 auto !important;
          max-width: 18cm !important; /* Mimic max-w-4xl on A4 */
          page-break-inside: auto;
        }
        
        .mb-20, .mb-16, .mb-12, .py-20, .pt-28, .pb-12 {
            margin-bottom: 12px !important;
            padding-top: 4px !important;
            padding-bottom: 4px !important;
        }
        
        .max-w-4xl, .max-w-5xl, .max-w-6xl, .max-w-7xl {
          max-width: 18cm !important;
          padding: 0 !important;
          margin: 0 auto !important;
        }

        /* 5. 标题与文字 */
        h1 { font-size: 26pt !important; margin-bottom: 6px !important; letter-spacing: -0.02em !important; }
        h2 { font-size: 20pt !important; margin-top: 16px !important; margin-bottom: 10px !important; letter-spacing: -0.02em !important; }
        h3 { font-size: 16pt !important; margin-bottom: 4px !important; letter-spacing: -0.01em !important; }
        h4 { font-size: 13pt !important; letter-spacing: -0.01em !important; }
        
        /* 6. 保持网格布局但优化空间 */
        .grid {
          display: grid !important;
          gap: 12px !important;
        }

        /* 7. 链接处理：不再强制显示长 URL */
        a { text-decoration: none !important; color: inherit !important; }
        a:after { content: "" !important; }

        /* 8. 分页保护 */
        li, .rounded-xl, .rounded-lg {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        /* 确保标题不孤立在页尾 */
        h1, h2, h3, h4, h5, h6 {
          page-break-after: avoid !important;
          break-after: avoid !important;
        }

        /* 9. 针对特定组件的微调 */
        #home {
          min-height: auto !important;
          padding-top: 0 !important;
          border-bottom: 1px solid #e2e8f0;
        }

        /* 技能标签紧凑化 */

            padding: 2px 6px !important;
            font-size: 8.5pt !important;
