    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-tech {
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3b82f6;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb;
      }
      .dark ::-webkit-scrollbar-track {
         background: #0f172a;
      }

      /* === 打印样式优化 (Print / PDF Export) === */
      @media print {
        /* 1. 核心设置：保留网页色彩与背景 */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          box-shadow: none !important;
        }

        /* 2. 隐藏非核心 UI 元素与禁止动画 */
        nav, 
        .fixed,   
        button,   
        [aria-label="Toggle Theme"],
        [title="Switch to English"],
        form,
        .animate-float,
        .animate-pulse-glow,
        .absolute.inset-0, 
        svg.absolute,
        iframe,
        .print\:hidden,
        #chat-widget,
        #scroll-to-top,
        .animate-fade-in,
        .animate-fade-in-up,
        .animate-slide-up,
        .animate-bounce
        {
          display: none !important;
          animation: none !important;
          transition: none !important;
        }

        /* 统一关闭所有动画和过渡 */
        * {
          animation-delay: 0s !important;
          animation-duration: 0s !important;
          transition-delay: 0s !important;
          transition-duration: 0s !important;
        }

        /* 3. 页面边距与尺寸 */
        @page {
          margin: 1cm 1cm; 
          size: A4 portrait;
        }

        body {
          background: white !important;
          color: #0f172a !important; /* slate-900 */
          font-size: 9.5pt; 
          line-height: 1.35;
          letter-spacing: -0.01em;
          overflow: visible !important;
        }

        /* 4. 允许绝大多数容器自然分页，防止整块下移造成海量空白 */
        section {
          padding: 8px 0 !important;
          margin: 0 auto 10px auto !important;
          max-width: 100% !important; 
          page-break-inside: auto !important;
          break-inside: auto !important;
        }

        div, article, .rounded-xl, .rounded-lg, .rounded-2xl, .group {
          page-break-inside: auto !important;
          break-inside: auto !important;
        }

        .mb-20, .mb-16, .mb-12, .mb-10, .mb-8, .mb-6, .py-20, .pt-28, .pb-12, .py-12 {
          margin-bottom: 8px !important;
          padding-top: 4px !important;
          padding-bottom: 4px !important;
        }

        .max-w-4xl, .max-w-5xl, .max-w-6xl, .max-w-7xl {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 auto !important;
        }

        /* 5. 标题与段落文字：段落留白与防孤行 */
        p {
          margin-bottom: 6px !important;
          line-height: 1.45 !important;
        }
        p:last-child {
          margin-bottom: 2px !important;
        }

        h1 { font-size: 20pt !important; margin-bottom: 4px !important; letter-spacing: -0.02em !important; }
        h2 { 
          font-size: 14pt !important; 
          margin-top: 12px !important; 
          margin-bottom: 6px !important; 
          letter-spacing: -0.02em !important; 
          border-bottom: 1.5px solid #2563eb !important; 
          padding-bottom: 3px !important;
          page-break-after: avoid !important;
          break-after: avoid !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }
        h3 { 
          font-size: 11.5pt !important; 
          margin-top: 8px !important;
          margin-bottom: 4px !important; 
          letter-spacing: -0.01em !important;
          page-break-after: avoid !important;
          break-after: avoid !important;
        }
        h4, h5, h6 { 
          font-size: 10pt !important; 
          margin-top: 6px !important;
          margin-bottom: 3px !important;
          page-break-after: avoid !important;
          break-after: avoid !important;
        }

        /* 6. 保持网格布局但优化空间 */
        .grid {
          display: grid !important;
          gap: 10px !important;
        }

        /* 7. 链接处理 */
        a { text-decoration: none !important; color: inherit !important; }
        a:after { content: "" !important; }

        /* 8. 细粒度控制：列表与段落间距 */
        ul, ol {
          margin-top: 3px !important;
          margin-bottom: 6px !important;
        }
        li {
          margin-bottom: 3px !important;
          line-height: 1.4 !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .print\:break-inside-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        /* 强制分页控制：支持特定模块另起一页 */
        .print\:break-before-page,
        .print\:page-break-before {
          break-before: page !important;
          page-break-before: always !important;
        }

        .print\:break-after-page,
        .print\:page-break-after {
          break-after: page !important;
          page-break-after: always !important;
        }

        /* 职业生涯模块默认强制从新一页开始，消除第一页底部挤压与不自然留白 */
        #experience {
          break-before: page !important;
          page-break-before: always !important;
        }

        /* 9. Component Specific overrides */
        #home {
          min-height: auto !important;
          padding-top: 0 !important;
          border-bottom: 1px solid #cbd5e1;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        /* 技能标签紧凑化 */
        #skills span {
          padding: 1px 5px !important;
          font-size: 8pt !important;
        }
      }
